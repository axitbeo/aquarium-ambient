<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061c2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aquarium">
  <meta name="description" content="A calm aquarium ambient display for iPad.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Aquarium Ambient</title>
  <style>
    :root {
      color-scheme: dark;
      --deep: #041725;
      --blue: #07344a;
      --glow: #61d9e8;
      --soft: rgba(220, 249, 255, .82);
      --muted: rgba(210, 239, 246, .62);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--deep); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .ocean {
      position: fixed; inset: 0; overflow: hidden; isolation: isolate;
      background:
        radial-gradient(ellipse at 48% 2%, rgba(105, 222, 225, .28), transparent 36%),
        radial-gradient(ellipse at 82% 45%, rgba(12, 118, 142, .35), transparent 38%),
        linear-gradient(180deg, #0a4054 0%, #07354c 34%, #06283d 67%, #031827 100%);
    }
    .sun-rays {
      position: absolute; inset: -25% 12% 28%; opacity: .20; filter: blur(10px);
      background: repeating-conic-gradient(from 245deg at 50% 0%, transparent 0deg 8deg, rgba(169,245,239,.23) 9deg 11deg, transparent 12deg 22deg);
      mask-image: linear-gradient(to bottom, black, transparent 85%);
      animation: rays 24s ease-in-out infinite alternate;
    }
    @keyframes rays { from { transform: translateX(-2%) rotate(-3deg); opacity: .12; } to { transform: translateX(2%) rotate(3deg); opacity: .25; } }
    .water-shimmer {
      position: absolute; inset: 0; opacity: .12;
      background: repeating-linear-gradient(112deg, transparent 0 34px, rgba(173,244,241,.16) 35px 37px, transparent 38px 76px);
      mix-blend-mode: screen; animation: shimmer 18s linear infinite;
    }
    @keyframes shimmer { to { transform: translateX(8%); } }
    .haze { position:absolute; inset: 35% -20% -10%; background: radial-gradient(ellipse, rgba(37,177,173,.18), transparent 65%); filter: blur(24px); }
    .floor {
      position: absolute; bottom: -2%; left: -5%; width: 110%; height: 22%;
      background: linear-gradient(180deg, rgba(12,83,83,.08), rgba(2,20,29,.92));
      clip-path: ellipse(72% 54% at 50% 100%);
    }
    .plant {
      position:absolute; bottom: 1%; width: 18%; height: 37%; transform-origin: bottom center;
      opacity: .74; filter: drop-shadow(0 0 12px rgba(50,211,165,.12));
    }
    .plant:before, .plant:after {
      content:""; position:absolute; bottom:0; left:50%; width: 13%; height:100%;
      border-radius: 100% 0 100% 0; border-left: 3px solid rgba(75,197,153,.65);
      transform: rotate(14deg); transform-origin: bottom;
    }
    .plant:after { height:78%; transform: rotate(-17deg); border-color: rgba(46,163,139,.65); }
    .plant.left { left:-2%; animation:sway 7s ease-in-out infinite alternate; }
    .plant.right { right:-3%; transform:scaleX(-1) scale(1.2); animation:sway 8s ease-in-out infinite alternate-reverse; }
    .plant.mid { left:18%; height:24%; width:10%; opacity:.4; animation:sway 6s ease-in-out infinite alternate; }
    @keyframes sway { from { rotate:-5deg; } to { rotate:7deg; } }
    .rock { position:absolute; bottom:3%; height:7%; width:13%; background:linear-gradient(145deg,#47766e,#102f38 70%); border-radius:55% 48% 15% 18%; opacity:.8; }
    .rock.r1 { left:30%; transform:scale(.8); } .rock.r2 { right:28%; transform:scale(1.15); }
    .fish {
      --scale: 1; position:absolute; width:clamp(72px, 10vw, 130px); height:clamp(36px, 5vw, 58px);
      animation: swim var(--duration, 24s) linear infinite; animation-delay:var(--delay,0s);
      filter: drop-shadow(0 7px 12px rgba(0,0,0,.22));
    }
    .fish .body {
      position:absolute; inset:10% 15% 10% 4%; border-radius:55% 48% 48% 55%;
      background:linear-gradient(180deg,var(--fish-top,#f6b86c),var(--fish-bottom,#dc744c));
      box-shadow:inset 0 3px 5px rgba(255,255,255,.28), inset 0 -5px 8px rgba(0,0,0,.16);
    }
    .fish .tail {
      position:absolute; right:0; top:22%; width:29%; height:58%;
      background:var(--fish-bottom,#dc744c); clip-path:polygon(0 50%,100% 0,85% 50%,100% 100%);
      transform-origin:left center; animation: tail .55s ease-in-out infinite alternate;
    }
    .fish .fin {
      position:absolute; left:43%; top:0; width:25%; height:35%;
      background:rgba(255,218,158,.75); clip-path:polygon(0 100%,45% 0,100% 100%);
    }
    .fish .eye { position:absolute; left:17%; top:39%; width:5px; height:5px; border-radius:50%; background:#10212b; box-shadow:0 0 0 2px rgba(255,255,255,.55); }
    .fish .stripe { position:absolute; top:13%; left:52%; height:74%; width:5%; border-radius:100%; background:rgba(255,255,255,.45); }
    @keyframes tail { to { transform:rotate(-14deg); } }
    @keyframes swim {
      0% { transform:translateX(-22vw) translateY(0) scaleX(1) scale(var(--scale)); }
      48% { transform:translateX(50vw) translateY(-18px) scaleX(1) scale(var(--scale)); }
      50% { transform:translateX(52vw) translateY(-18px) scaleX(-1) scale(var(--scale)); }
      98% { transform:translateX(112vw) translateY(6px) scaleX(-1) scale(var(--scale)); }
      100% { transform:translateX(112vw) translateY(6px) scaleX(-1) scale(var(--scale)); }
    }
    .fish.f2 { top:30%; --duration:34s; --delay:-13s; --scale:.72; --fish-top:#a5e2d4; --fish-bottom:#4caa9d; }
    .fish.f1 { top:56%; --duration:29s; --delay:-6s; --scale:1.05; }
    .fish.f3 { top:42%; --duration:39s; --delay:-27s; --scale:.55; --fish-top:#f5d88d; --fish-bottom:#bf9b55; }
    .fish.f4 { top:68%; --duration:44s; --delay:-19s; --scale:.68; --fish-top:#b5d5e7; --fish-bottom:#5b91b1; }
    .bubble {
      position:absolute; bottom:-40px; width:var(--size,7px); height:var(--size,7px); border:1px solid rgba(208,250,255,.5);
      border-radius:50%; background:rgba(203,248,255,.08); box-shadow:inset -2px -2px 4px rgba(255,255,255,.12);
      animation: rise var(--time,18s) linear infinite; animation-delay:var(--wait,0s);
    }
    @keyframes rise { to { transform:translate3d(var(--drift,20px),-115vh,0); opacity:.05; } }
    .content {
      position:absolute; z-index:5; inset:0; display:flex; flex-direction:column; justify-content:space-between;
      padding:calc(5.5vh + var(--safe-top)) clamp(28px,6vw,90px) calc(4vh + var(--safe-bottom));
      pointer-events:none;
    }
    .topline { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; }
    .brand { font-size:clamp(10px,1.15vw,14px); letter-spacing:.28em; text-transform:uppercase; color:rgba(221,249,250,.58); }
    .location { font-size:clamp(11px,1.2vw,15px); color:rgba(221,249,250,.55); letter-spacing:.08em; text-align:right; }
    .clock-wrap { text-align:center; margin-top:auto; margin-bottom:auto; transform:translateY(1vh); text-shadow:0 4px 30px rgba(0,15,25,.24); }
    .time { font-size:clamp(64px,12vw,156px); line-height:.95; font-weight:200; letter-spacing:-.065em; font-variant-numeric:tabular-nums; color:rgba(246,255,255,.94); }
    .date { margin-top:clamp(14px,2vw,24px); font-size:clamp(13px,1.8vw,22px); letter-spacing:.22em; text-transform:uppercase; font-weight:400; color:rgba(221,249,250,.72); }
    .bottomline { display:flex; justify-content:space-between; align-items:flex-end; }
    .quote { font-size:clamp(11px,1.3vw,15px); color:rgba(220,245,247,.58); letter-spacing:.08em; }
    .status { display:flex; align-items:center; gap:8px; font-size:11px; color:rgba(220,245,247,.55); letter-spacing:.12em; text-transform:uppercase; }
    .dot { width:6px;height:6px;border-radius:50%;background:#83e6ce;box-shadow:0 0 12px #83e6ce; }
    .controls {
      position:absolute; z-index:10; right:20px; bottom:calc(18px + var(--safe-bottom)); display:flex; gap:8px;
      opacity:0; transition:opacity .35s ease; pointer-events:none;
    }
    body.show-controls .controls { opacity:1; pointer-events:auto; }
    .control {
      border:1px solid rgba(224,250,255,.22); background:rgba(2,22,34,.38); color:rgba(240,255,255,.9);
      backdrop-filter:blur(14px); border-radius:999px; min-width:44px; height:44px; padding:0 14px;
      font:500 12px -apple-system,BlinkMacSystemFont,sans-serif; letter-spacing:.04em;
    }
    .hint { position:absolute; z-index:10; left:50%; bottom:calc(22px + var(--safe-bottom)); transform:translateX(-50%);
      font-size:10px; letter-spacing:.13em; color:rgba(220,245,247,.36); text-transform:uppercase; transition:opacity .4s; pointer-events:none; }
    body.show-controls .hint { opacity:0; }
    body.clock-hidden .clock-wrap { opacity:0; transition:opacity .5s; }
    .clock-wrap { transition:opacity .5s; }
    @media (orientation:portrait) {
      .content { padding-left:8vw; padding-right:8vw; }
      .time { font-size:clamp(62px,17vw,110px); }
      .topline { align-items:flex-start; }
      .fish { width:88px; height:42px; }
      .bottomline { align-items:flex-start; flex-direction:column; gap:10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
    }
  </style>
</head>
<body>
  <main class="ocean" id="ocean" aria-label="Animated aquarium ambient background">
    <div class="sun-rays"></div><div class="water-shimmer"></div><div class="haze"></div>
    <div class="plant left"></div><div class="plant mid"></div><div class="plant right"></div>
    <div class="rock r1"></div><div class="rock r2"></div><div class="floor"></div>

    <div class="fish f1"><div class="tail"></div><div class="fin"></div><div class="body"></div><div class="stripe"></div><div class="eye"></div></div>
    <div class="fish f2"><div class="tail"></div><div class="fin"></div><div class="body"></div><div class="stripe"></div><div class="eye"></div></div>
    <div class="fish f3"><div class="tail"></div><div class="fin"></div><div class="body"></div><div class="eye"></div></div>
    <div class="fish f4"><div class="tail"></div><div class="fin"></div><div class="body"></div><div class="eye"></div></div>
    <div id="bubbles"></div>
  </main>

  <section class="content">
    <div class="topline">
      <div class="brand">A Q U A R I U M<br><span style="letter-spacing:.12em;font-size:.78em;opacity:.7">AMBIENT DISPLAY</span></div>
      <div class="location" id="greeting">A little moment of calm</div>
    </div>
    <div class="clock-wrap" id="clockWrap">
      <div class="time" id="time">--:--</div>
      <div class="date" id="date">LOADING DATE</div>
    </div>
    <div class="bottomline">
      <div class="quote" id="quote">Breathe in. Drift along.</div>
      <div class="status"><span class="dot"></span><span>UNDERWATER · LIVE CLOCK</span></div>
    </div>
  </section>

  <div class="hint" id="hint">Tap anywhere for controls</div>
  <nav class="controls" aria-label="Ambient controls">
    <button class="control" id="clockButton">Clock on/off</button>
    <button class="control" id="motionButton">Motion on/off</button>
    <button class="control" id="fullscreenButton">Full screen</button>
  </nav>

  <script>
    (() => {
      const timeEl = document.getElementById('time');
      const dateEl = document.getElementById('date');
      const greetingEl = document.getElementById('greeting');
      const body = document.body;
      const ocean = document.getElementById('ocean');
      let controlsTimer;

      function updateClock() {
        const now = new Date();
        timeEl.textContent = new Intl.DateTimeFormat('vi-VN', {
          hour: '2-digit', minute: '2-digit', hour12: false
        }).format(now);
        dateEl.textContent = new Intl.DateTimeFormat('vi-VN', {
          weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        }).format(now).toLocaleUpperCase('vi-VN');
        const h = now.getHours();
        greetingEl.textContent = h < 11 ? 'A peaceful morning' : h < 17 ? 'Drift through the afternoon' : 'A quiet evening';
      }
      updateClock();
      setInterval(updateClock, 1000);

      const bubbleHost = document.getElementById('bubbles');
      for (let i = 0; i < 24; i++) {
        const b = document.createElement('span');
        b.className = 'bubble';
        b.style.left = (3 + Math.random() * 94) + '%';
        b.style.setProperty('--size', (3 + Math.random() * 8) + 'px');
        b.style.setProperty('--time', (13 + Math.random() * 18) + 's');
        b.style.setProperty('--wait', (-Math.random() * 28) + 's');
        b.style.setProperty('--drift', (-30 + Math.random() * 60) + 'px');
        bubbleHost.appendChild(b);
      }

      function revealControls() {
        body.classList.add('show-controls');
        clearTimeout(controlsTimer);
        controlsTimer = setTimeout(() => body.classList.remove('show-controls'), 4500);
      }
      document.addEventListener('pointerdown', (event) => {
        if (event.target.closest('.controls')) { revealControls(); return; }
        if (body.classList.contains('show-controls')) {
          body.classList.remove('show-controls');
          clearTimeout(controlsTimer);
        } else revealControls();
      });

      document.getElementById('clockButton').addEventListener('click', () => {
        body.classList.toggle('clock-hidden');
        revealControls();
      });
      document.getElementById('motionButton').addEventListener('click', () => {
        body.classList.toggle('motion-paused');
        const paused = body.classList.contains('motion-paused');
        ocean.querySelectorAll('*').forEach(el => el.style.animationPlayState = paused ? 'paused' : 'running');
        document.getElementById('motionButton').textContent = paused ? 'Motion resume' : 'Motion pause';
        revealControls();
      });
      document.getElementById('fullscreenButton').addEventListener('click', async () => {
        try {
          if (!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
          else if (document.exitFullscreen) await document.exitFullscreen();
        } catch (_) { /* iOS Safari may not expose fullscreen API; standalone mode is already immersive. */ }
        revealControls();
      });

      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
      }
    })();
  </script>
</body>
</html>
