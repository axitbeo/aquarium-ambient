<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061c2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aquarium">
  <meta name="description" content="A calm aquarium ambient display for iPad.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Aquarium Ambient</title>
  <style>
    :root {
      color-scheme: dark;
      --deep: #041725;
      --blue: #07344a;
      --glow: #61d9e8;
      --soft: rgba(220, 249, 255, .82);
      --muted: rgba(210, 239, 246, .62);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--deep); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .ocean {
      position: fixed; inset: 0; overflow: hidden; isolation: isolate;
      background:
        radial-gradient(ellipse at 48% 2%, rgba(105, 222, 225, .28), transparent 36%),
        radial-gradient(ellipse at 82% 45%, rgba(12, 118, 142, .35), transparent 38%),
        linear-gradient(180deg, #0a4054 0%, #07354c 34%, #06283d 67%, #031827 100%);
    }
    .sun-rays {
      position: absolute; inset: -25% 12% 28%; opacity: .20; filter: blur(10px);
      background: repeating-conic-gradient(from 245deg at 50% 0%, transparent 0deg 8deg, rgba(169,245,239,.23) 9deg 11deg, transparent 12deg 22deg);
      mask-image: linear-gradient(to bottom, black, transparent 85%);
      animation: rays 24s ease-in-out infinite alternate;
    }
    @keyframes rays { from { transform: translateX(-2%) rotate(-3deg); opacity: .12; } to { transform: translateX(2%) rotate(3deg); opacity: .25; } }
    .water-shimmer {
      position: absolute; inset: 0; opacity: .12;
      background: repeating-linear-gradient(112deg, transparent 0 34px, rgba(173,244,241,.16) 35px 37px, transparent 38px 76px);
      mix-blend-mode: screen; animation: shimmer 18s linear infinite;
    }
    @keyframes shimmer { to { transform: translateX(8%); } }
    .haze { position:absolute; inset: 35% -20% -10%; background: radial-gradient(ellipse, rgba(37,177,173,.18), transparent 65%); filter: blur(24px); }
    .floor {
      position: absolute; bottom: -2%; left: -5%; width: 110%; height: 22%;
      background: linear-gradient(180deg, rgba(12,83,83,.08), rgba(2,20,29,.92));
      clip-path: ellipse(72% 54% at 50% 100%);
    }
    .plant {
      position:absolute; bottom: 1%; width: 18%; height: 37%; transform-origin: bottom center;
      opacity: .74; filter: drop-shadow(0 0 12px rgba(50,211,165,.12));
    }
    .plant:before, .plant:after {
      content:""; position:absolute; bottom:0; left:50%; width: 13%; height:100%;
      border-radius: 100% 0 100% 0; border-left: 3px solid rgba(75,197,153,.65);
      transform: rotate(14deg); transform-origin: bottom;
    }
    .plant:after { height:78%; transform: rotate(-17deg); border-color: rgba(46,163,139,.65); }
    .plant.left { left:-2%; animation:sway 7s ease-in-out infinite alternate; }
    .plant.right { right:-3%; transform:scaleX(-1) scale(1.2); animation:sway 8s ease-in-out infinite alternate-reverse; }
    .plant.mid { left:18%; height:24%; width:10%; opacity:.4; animation:sway 6s ease-in-out infinite alternate; }
    @keyframes sway { from { rotate:-5deg; } to { rotate:7deg; } }
    .rock { position:absolute; bottom:3%; height:7%; width:13%; background:linear-gradient(145deg,#47766e,#102f38 70%); border-radius:55% 48% 15% 18%; opacity:.8; }
    .rock.r1 { left:30%; transform:scale(.8); } .rock.r2 { right:28%; transform:scale(1.15); }
    .fish {
      --scale: 1; position:absolute; width:clamp(72px, 10vw, 130px); height:clamp(36px, 5vw, 58px);
      animation: swim var(--duration, 24s) linear infinite; animation-delay:var(--delay,0s);
      filter: drop-shadow(0 7px 12px rgba(0,0,0,.22));
    }
    .fish .body {
      position:absolute; inset:10% 15% 10% 4%; border-radius:55% 48% 48% 55%;
      background:linear-gradient(180deg,var(--fish-top,#f6b86c),var(--fish-bottom,#dc744c));
      box-shadow:inset 0 3px 5px rgba(255,255,255,.28), inset 0 -5px 8px rgba(0,0,0,.16);
    }
    .fish .tail {
      position:absolute; right:0; top:22%; width:29%; height:58%;
      background:var(--fish-bottom,#dc744c); clip-path:polygon(0 50%,100% 0,85% 50%,100% 100%);
      transform-origin:left center; animation: tail .55s ease-in-out infinite alternate;
    }
    .fish .fin {
      position:absolute; left:43%; top:0; width:25%; height:35%;
      background:rgba(255,218,158,.75); clip-path:polygon(0 100%,45% 0,100% 100%);
    }
    .fish .eye { position:absolute; left:17%; top:39%; width:5px; height:5px; border-radius:50%; background:#10212b; box-shadow:0 0 0 2px rgba(255,255,255,.55); }
    .fish .stripe { position:absolute; top:13%; left:52%; height:74%; width:5%; border-radius:100%; background:rgba(255,255,255,.45); }
    @keyframes tail { to { transform:rotate(-14deg); } }
    @keyframes swim {
      0% { transform:translateX(-22vw) translateY(0) scaleX(1) scale(var(--scale)); }
      48% { transform:translateX(50vw) translateY(-18px) scaleX(1) scale(var(--scale)); }
      50% { transform:translateX(52vw) translateY(-18px) scaleX(-1) scale(var(--scale)); }
      98% { transform:translateX(112vw) translateY(6px) scaleX(-1) scale(var(--scale)); }
      100% { transform:translateX(112vw) translateY(6px) scaleX(-1) scale(var(--scale)); }
    }
    .fish.f2 { top:30%; --duration:34s; --delay:-13s; --scale:.72; --fish-top:#a5e2d4; --fish-bottom:#4caa9d; }
    .fish.f1 { top:56%; --duration:29s; --delay:-6s; --scale:1.05; }
    .fish.f3 { top:42%; --duration:39s; --delay:-27s; --scale:.55; --fish-top:#f5d88d; --fish-bottom:#bf9b55; }
    .fish.f4 { top:68%; --duration:44s; --delay:-19s; --scale:.68; --fish-top:#b5d5e7; --fish-bottom:#5b91b1; }
    /* ---- V2 video layer ----
       Sits above the CSS scene, below bubbles. Invisible until the video is actually
       playing (body.video-on), then the CSS scene is hidden (body.video-ready) so it
       stops costing paint/animation time. If the video fails, the CSS scene remains. */
    .video-bg {
      position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;
      opacity:0; transition:opacity 1.6s ease; pointer-events:none; background:transparent;
    }
    /* V3 crossfade: .front is the visible video; .incoming fades in above it, so the
       outgoing video stays opaque underneath and no black frame can show. */
    .video-bg.front { opacity:1; z-index:1; }
    .video-bg.incoming { z-index:2; }
    .vignette, #bubbles { position:absolute; inset:0; z-index:3; pointer-events:none; }
    /* Cheap static vignette for depth over the footage (no filters, no animation). */
    .vignette { position:absolute; inset:0; display:none; pointer-events:none;
      background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(2,14,22,.55) 100%); }
    body.video-on .vignette { display:block; }
    body.video-ready .sun-rays, body.video-ready .water-shimmer, body.video-ready .haze,
    body.video-ready .plant, body.video-ready .rock, body.video-ready .floor,
    body.video-ready .fish { display:none; }
    /* Over real footage keep only a few subtle bubbles. */
    body.video-ready .bubble:nth-child(n+11) { display:none; }
    .bubble {
      position:absolute; bottom:-40px; width:var(--size,7px); height:var(--size,7px); border:1px solid rgba(208,250,255,.5);
      border-radius:50%; background:rgba(203,248,255,.08); box-shadow:inset -2px -2px 4px rgba(255,255,255,.12);
      animation: rise var(--time,18s) linear infinite; animation-delay:var(--wait,0s);
    }
    @keyframes rise { to { transform:translate3d(var(--drift,20px),-115vh,0); opacity:.05; } }
    .content {
      position:absolute; z-index:5; inset:0; display:flex; flex-direction:column; justify-content:space-between;
      padding:calc(5.5vh + var(--safe-top)) clamp(28px,6vw,90px) calc(4vh + var(--safe-bottom));
      pointer-events:none;
    }
    .topline { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; }
    .brand { font-size:clamp(10px,1.15vw,14px); letter-spacing:.28em; text-transform:uppercase; color:rgba(221,249,250,.58); }
    .location { font-size:clamp(11px,1.2vw,15px); color:rgba(221,249,250,.55); letter-spacing:.08em; text-align:right; }
    .clock-wrap { text-align:center; margin-top:auto; margin-bottom:auto; transform:translateY(1vh); text-shadow:0 4px 30px rgba(0,15,25,.24); }
    .time { font-size:clamp(64px,12vw,156px); line-height:.95; font-weight:200; letter-spacing:-.065em; font-variant-numeric:tabular-nums; color:rgba(246,255,255,.94); }
    .date { margin-top:clamp(14px,2vw,24px); font-size:clamp(13px,1.8vw,22px); letter-spacing:.22em; text-transform:uppercase; font-weight:400; color:rgba(221,249,250,.72); }
    .bottomline { display:flex; justify-content:space-between; align-items:flex-end; }
    .quote { font-size:clamp(11px,1.3vw,15px); color:rgba(220,245,247,.58); letter-spacing:.08em; }
    .status { display:flex; align-items:center; gap:8px; font-size:11px; color:rgba(220,245,247,.55); letter-spacing:.12em; text-transform:uppercase; }
    .dot { width:6px;height:6px;border-radius:50%;background:#83e6ce;box-shadow:0 0 12px #83e6ce; }
    .controls {
      position:absolute; z-index:10; right:20px; bottom:calc(18px + var(--safe-bottom)); display:flex; gap:8px;
      opacity:0; transition:opacity .35s ease; pointer-events:none;
    }
    body.show-controls .controls { opacity:1; pointer-events:auto; }
    .control {
      /* V2: solid tint instead of backdrop-filter, which is costly over playing video. */
      border:1px solid rgba(224,250,255,.22); background:rgba(2,22,34,.62); color:rgba(240,255,255,.9);
      border-radius:999px; min-width:44px; height:44px; padding:0 14px;
      font:500 12px -apple-system,BlinkMacSystemFont,sans-serif; letter-spacing:.04em;
    }
    .hint { position:absolute; z-index:10; left:50%; bottom:calc(22px + var(--safe-bottom)); transform:translateX(-50%);
      font-size:10px; letter-spacing:.13em; color:rgba(220,245,247,.36); text-transform:uppercase; transition:opacity .4s; pointer-events:none; }
    body.show-controls .hint { opacity:0; }
    body.clock-hidden .clock-wrap { opacity:0; transition:opacity .5s; }
    .clock-wrap { transition:opacity .5s; }
    /* ---- V3 player panel ----
       display:none while closed, so it costs nothing over the aquarium. Solid tint, no
       backdrop-filter (expensive over video). All touch targets >= 44px. */
    .player-scrim { position:fixed; inset:0; z-index:19; display:none; background:rgba(1,10,16,.25); }
    .player {
      position:fixed; z-index:20; top:0; right:0; bottom:0; width:min(440px, 100vw);
      display:none; flex-direction:column; gap:14px;
      padding:calc(16px + var(--safe-top)) 18px calc(14px + var(--safe-bottom));
      background:rgba(3,19,29,.95); border-left:1px solid rgba(224,250,255,.1);
      box-shadow:-24px 0 60px rgba(0,0,0,.35); color:var(--soft);
      font-size:13px; letter-spacing:.02em;
    }
    body.panel-open .player-scrim { display:block; }
    body.panel-open .player { display:flex; animation:panelIn .28s ease-out; }
    body.panel-open .hint, body.panel-open .controls { opacity:0; pointer-events:none; }
    @keyframes panelIn { from { transform:translateX(28px); opacity:0; } }
    .player button { font:inherit; color:inherit; cursor:pointer; -webkit-appearance:none; appearance:none; }
    .player button:disabled { opacity:.4; cursor:default; }
    .player-head { display:flex; align-items:center; gap:10px; }
    .player-tabs { flex:1; display:flex; padding:4px; border-radius:999px; background:rgba(224,250,255,.06); }
    .tab { flex:1; min-height:40px; border:0; border-radius:999px; background:transparent; font-weight:500; color:var(--muted) !important; }
    .tab.on { background:rgba(97,217,232,.16); color:#e9fdff !important; }
    .player-close { width:44px; height:44px; border-radius:50%; border:1px solid rgba(224,250,255,.16); background:transparent; font-size:16px !important; }
    .player-body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:14px; padding-right:2px; }
    .player-foot { font-size:11px; color:var(--muted); letter-spacing:.06em; display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-height:36px; }
    .prow { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .seg { display:flex; border:1px solid rgba(224,250,255,.14); border-radius:999px; overflow:hidden; }
    .seg button { min-height:44px; padding:0 12px; border:0; background:transparent; font-size:12px !important; color:var(--muted) !important; }
    .seg button.on { background:rgba(97,217,232,.18); color:#e9fdff !important; }
    .transport { display:flex; gap:6px; }
    .transport button, .pact {
      min-height:44px; padding:0 14px; border-radius:999px; border:1px solid rgba(224,250,255,.18);
      background:rgba(97,217,232,.1); font-size:12px !important; white-space:nowrap;
    }
    .pact { min-height:36px; padding:0 12px; }
    .pact.ghost { background:transparent; color:var(--muted) !important; }
    .cards { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .card { display:flex; flex-direction:column; gap:8px; padding:8px; border-radius:16px; background:rgba(224,250,255,.04); border:1px solid transparent; }
    .card.current { border-color:rgba(97,217,232,.45); background:rgba(97,217,232,.07); }
    .card-main { display:flex; flex-direction:column; gap:8px; padding:0; border:0; background:none; text-align:left; }
    .thumb { position:relative; display:block; width:100%; aspect-ratio:16/9; border-radius:10px; overflow:hidden;
      background:linear-gradient(160deg,#0d4a5e,#06283d 60%,#031827); }
    .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .now { position:absolute; left:8px; bottom:8px; padding:3px 8px; border-radius:999px; font-size:10px; letter-spacing:.08em;
      text-transform:uppercase; background:rgba(3,19,29,.78); color:#bff6ff; }
    .ctitle, .ttitle { font-size:13px; font-weight:500; color:#eafcff; }
    .cmeta, .tmeta { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .tracks { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
    .track { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 8px 6px 4px; border-radius:14px;
      background:rgba(224,250,255,.04); border:1px solid transparent; flex-wrap:wrap; }
    .track.current { border-color:rgba(97,217,232,.45); background:rgba(97,217,232,.07); }
    .track-main { flex:1; min-height:44px; display:flex; align-items:center; gap:10px; border:0; background:none; text-align:left; padding:0 6px; }
    .tdot { width:8px; height:8px; border-radius:50%; background:rgba(224,250,255,.2); flex:none; }
    .track.current .tdot { background:#83e6ce; box-shadow:0 0 10px #83e6ce; }
    /* Cache status: shape + colour + text, so states are distinguishable at a glance. */
    .badge { display:inline-flex; align-items:center; min-height:24px; padding:0 9px; border-radius:999px; font-size:10.5px;
      letter-spacing:.06em; text-transform:uppercase; border:1px solid currentColor; white-space:nowrap; }
    .s-available, .s-offline { color:rgba(210,239,246,.7); }
    .s-cached { color:#06231d; background:#83e6ce; border-color:#83e6ce; }
    .s-update { color:#ffd27a; }
    .s-missing { color:#ff9a8f; border-style:dashed; }
    .s-error { color:#ff9a8f; }
    .s-downloading { color:#9fe9f5; background:rgba(97,217,232,.12); }
    .switch { display:inline-flex; align-items:center; gap:10px; min-height:44px; padding:0 14px 0 6px; border-radius:999px;
      border:1px solid rgba(224,250,255,.18); background:transparent; }
    .knob { width:34px; height:20px; border-radius:999px; background:rgba(224,250,255,.18); position:relative; transition:background .2s; }
    .knob:after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#dff8fb; transition:transform .2s; }
    .switch.on .knob { background:#3fb8a4; }
    .switch.on .knob:after { transform:translateX(14px); }
    .vol { flex:1; min-width:150px; display:flex; align-items:center; gap:10px; color:var(--muted); }
    .vol input { flex:1; height:44px; accent-color:#61d9e8; }
    .pnote { margin:0; color:var(--muted); font-size:12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    @media (orientation:portrait) {
      .content { padding-left:8vw; padding-right:8vw; }
      .time { font-size:clamp(62px,17vw,110px); }
      .topline { align-items:flex-start; }
      .fish { width:88px; height:42px; }
      .bottomline { align-items:flex-start; flex-direction:column; gap:10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
    }
  </style>
</head>
<body>
  <main class="ocean" id="ocean" aria-label="Animated aquarium ambient background">
    <div class="sun-rays"></div><div class="water-shimmer"></div><div class="haze"></div>
    <div class="plant left"></div><div class="plant mid"></div><div class="plant right"></div>
    <div class="rock r1"></div><div class="rock r2"></div><div class="floor"></div>

    <div class="fish f1"><div class="tail"></div><div class="fin"></div><div class="body"></div><div class="stripe"></div><div class="eye"></div></div>
    <div class="fish f2"><div class="tail"></div><div class="fin"></div><div class="body"></div><div class="stripe"></div><div class="eye"></div></div>
    <div class="fish f3"><div class="tail"></div><div class="fin"></div><div class="body"></div><div class="eye"></div></div>
    <div class="fish f4"><div class="tail"></div><div class="fin"></div><div class="body"></div><div class="eye"></div></div>
    <!-- V3: two always-muted video layers for crossfades; sources come from library.js via player.js. -->
    <video class="video-bg" id="video" muted playsinline preload="auto" disablepictureinpicture aria-hidden="true"></video>
    <video class="video-bg" id="videoB" muted playsinline preload="auto" disablepictureinpicture aria-hidden="true"></video>
    <div class="vignette"></div>
    <div id="bubbles"></div>
  </main>

  <section class="content">
    <div class="topline">
      <div class="brand">A Q U A R I U M<br><span style="letter-spacing:.12em;font-size:.78em;opacity:.7">AMBIENT DISPLAY</span></div>
      <div class="location" id="greeting">A little moment of calm</div>
    </div>
    <div class="clock-wrap" id="clockWrap">
      <div class="time" id="time">--:--</div>
      <div class="date" id="date">LOADING DATE</div>
    </div>
    <div class="bottomline">
      <div class="quote" id="quote">Breathe in. Drift along.</div>
      <div class="status"><span class="dot"></span><span>UNDERWATER · LIVE CLOCK</span></div>
    </div>
  </section>

  <div class="hint" id="hint">Tap anywhere for controls</div>
  <nav class="controls" aria-label="Ambient controls">
    <button class="control" id="playerButton">Player</button>
    <button class="control" id="clockButton">Clock on/off</button>
    <button class="control" id="motionButton">Motion on/off</button>
    <button class="control" id="soundButton">Sound on</button>
    <button class="control" id="fullscreenButton">Full screen</button>
  </nav>
  <!-- V3 player panel (rendered by player.js; audio elements are created there too). -->
  <div class="player-scrim" id="playerScrim"></div>
  <aside class="player" id="player" aria-label="Aquarium player" aria-hidden="true">
    <header class="player-head">
      <div class="player-tabs" role="tablist">
        <button class="tab on" data-tab="video">Video</button>
        <button class="tab" data-tab="music">Music</button>
        <button class="tab" data-tab="ambience">Ambience</button>
      </div>
      <button class="player-close" id="playerClose" aria-label="Close player">✕</button>
    </header>
    <div class="player-body" id="playerBody"></div>
    <footer class="player-foot" id="playerFoot"></footer>
  </aside>

  <script>
    (() => {
      const timeEl = document.getElementById('time');
      const dateEl = document.getElementById('date');
      const greetingEl = document.getElementById('greeting');
      const body = document.body;
      const ocean = document.getElementById('ocean');
      let controlsTimer;

      // V2: formatters created once; DOM written only when text changes (once a minute).
      const timeFmt = new Intl.DateTimeFormat('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false });
      const dateFmt = new Intl.DateTimeFormat('vi-VN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      function setText(el, text) { if (el.textContent !== text) el.textContent = text; }
      function updateClock() {
        const now = new Date();
        setText(timeEl, timeFmt.format(now));
        setText(dateEl, dateFmt.format(now).toLocaleUpperCase('vi-VN'));
        const h = now.getHours();
        setText(greetingEl, h < 11 ? 'A peaceful morning' : h < 17 ? 'Drift through the afternoon' : 'A quiet evening');
      }
      updateClock();
      setInterval(updateClock, 1000);

      const bubbleHost = document.getElementById('bubbles');
      for (let i = 0; i < 24; i++) {
        const b = document.createElement('span');
        b.className = 'bubble';
        b.style.left = (3 + Math.random() * 94) + '%';
        b.style.setProperty('--size', (3 + Math.random() * 8) + 'px');
        b.style.setProperty('--time', (13 + Math.random() * 18) + 's');
        b.style.setProperty('--wait', (-Math.random() * 28) + 's');
        b.style.setProperty('--drift', (-30 + Math.random() * 60) + 'px');
        bubbleHost.appendChild(b);
      }

      // Video background, sound and the player panel live in player.js (V3).

      function revealControls() {
        body.classList.add('show-controls');
        clearTimeout(controlsTimer);
        controlsTimer = setTimeout(() => body.classList.remove('show-controls'), 4500);
      }
      document.addEventListener('pointerdown', (event) => {
        if (event.target.closest('.controls')) { revealControls(); return; }
        if (event.target.closest('.player, .player-scrim')) return;   // panel taps don't toggle the bar
        if (body.classList.contains('show-controls')) {
          body.classList.remove('show-controls');
          clearTimeout(controlsTimer);
        } else revealControls();
      });

      document.getElementById('clockButton').addEventListener('click', () => {
        body.classList.toggle('clock-hidden');
        revealControls();
      });
      document.getElementById('motionButton').addEventListener('click', () => {
        body.classList.toggle('motion-paused');
        const paused = body.classList.contains('motion-paused');
        ocean.querySelectorAll('*').forEach(el => el.style.animationPlayState = paused ? 'paused' : 'running');
        if (window.aquariumPlayer) window.aquariumPlayer.setMotion(paused);
        document.getElementById('motionButton').textContent = paused ? 'Motion resume' : 'Motion pause';
        revealControls();
      });
      document.getElementById('soundButton').addEventListener('click', revealControls);   // sound logic: player.js
      document.getElementById('playerButton').addEventListener('click', revealControls); // panel logic: player.js

      document.getElementById('fullscreenButton').addEventListener('click', async () => {
        try {
          if (!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
          else if (document.exitFullscreen) await document.exitFullscreen();
        } catch (_) { /* iOS Safari may not expose fullscreen API; standalone mode is already immersive. */ }
        revealControls();
      });

      // ---- V2 screen wake lock (iPadOS 16.4+; feature-detected) ----
      // Released automatically when the app is hidden, so re-request on return/tap.
      // Unsupported devices rely on the iPad's Auto-Lock setting.
      let wakeLock = null;
      async function keepAwake() {
        if (!('wakeLock' in navigator) || document.hidden || wakeLock) return;
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        } catch (_) { /* denied or unsupported in this mode */ }
      }
      document.addEventListener('visibilitychange', keepAwake);
      document.addEventListener('pointerdown', keepAwake);
      keepAwake();

      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        // Self-updating: the SW is cache-first, so without this an open (or suspended Home Screen)
        // app keeps showing the old cached page even after a new version is deployed.
        // When a new worker takes control, reload once so the new index.html/player.js load.
        // (Skipped on first install, when there was no previous controller.)
        const hadController = !!navigator.serviceWorker.controller;
        let reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!hadController || reloading) return;
          reloading = true;
          location.reload();
        });
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' }).then(reg => {
            // iPad Home Screen apps are suspended rather than relaunched, so also check for a
            // new version whenever the app comes back to the foreground (at most every 30 min).
            let lastCheck = Date.now();
            document.addEventListener('visibilitychange', () => {
              if (document.hidden || Date.now() - lastCheck < 30 * 60 * 1000) return;
              lastCheck = Date.now();
              reg.update().catch(() => {});
            });
          }).catch(() => {});
        });
      }
    })();
  </script>
  <script src="library.js"></script>
  <script src="player.js"></script>
</body>
